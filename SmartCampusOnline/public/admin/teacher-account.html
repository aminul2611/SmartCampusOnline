<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Account · Smart Campus</title>
</head>
<body>
  <p>
    <a href="./index.html#teachers">Open Teacher Management</a>
  </p>

  <script>
    const uid = new URLSearchParams(location.search)
      .get('teacher_id');

    location.replace(
      './index.html#teachers' +
      (uid ? '?edit=' + encodeURIComponent(uid) : '')
    );
  </script>
</body>
</html>
